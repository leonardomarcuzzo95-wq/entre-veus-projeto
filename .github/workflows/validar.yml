name: Validar fontes e evidencias
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter fontes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verificado em 2026-10-07
        with:
          persist-credentials: false
      - name: Preparar interpretador Lua para sintaxe e testes puros
        timeout-minutes: 2
        run: |
          # O mirror HTTP da imagem expirou; o arquivo oficial HTTPS respondeu no mesmo job.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends luajit
      - name: Validar arquivos permitidos, sintaxe e regressao dos relatorios
        shell: pwsh
        run: ./versionamento/Verificar-Repositorio.ps1 -CheckIndex -RequireLua
